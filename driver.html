<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>City Driver</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}rs();onresize=rs;
const R=n=>Math.random()*n,D0=40,DP=D0/.9-D0;
const COL=['#c33','#39c','#fc3','#3c6','#eee','#93c','#f80'];
let st='menu',stAt=0,lvl=1,coins=0,rew=0,why='',z=0,v=0,px=0,steer=0,hp=100,tm=0,goal=1500,cars=[],inv=0,shake=0,msg='',msgT=0;
const tp={L:0,R:0,G:0,B:0},kp={L:0,R:0,G:0,B:0};
try{lvl=+localStorage.getItem('cdl')||1;coins=+localStorage.getItem('cdc')||0}catch(e){}
function save(){try{localStorage.setItem('cdl',lvl);localStorage.setItem('cdc',coins)}catch(e){}}
const curve=q=>Math.sin(q/230)*.55+Math.sin(q/90)*.2;
// audio
let AC,eo,eg;
function ac(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();return AC}
function snd(f,d,t,vol){try{let a=ac(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.value=vol||.06;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
function eng(){try{if(!eo){let a=ac();eo=a.createOscillator();eg=a.createGain();eo.type='sawtooth';eg.gain.value=0;eo.connect(eg);eg.connect(a.destination);eo.start()}}catch(e){}}
function note(t){msg=t;msgT=1.3}
// game
function spawn(d){let l,t=0;do{l=[-.667,0,.667][Math.floor(R(3))];t++}while(t<8&&cars.some(k=>k.x==l&&Math.abs(k.z-z-d)<35));
 cars.push({x:l,z:z+d,s:8+R(8),col:COL[Math.floor(R(7))],pass:0})}
function start(){goal=1000+lvl*500;tm=goal/20;z=0;v=0;px=0;steer=0;hp=100;inv=0;shake=0;msgT=0;cars=[];
 for(let i=0;i<Math.floor(5+lvl*1.5);i++)spawn(60+R(600));
 st='play';eng()}
function end(s){st=s;stAt=performance.now()}
function upd(dt){
 if(eg){eg.gain.value=st=='play'?.012:0;eo.frequency.value=45+v*1.5}
 if(st!='play')return;
 const G=tp.G||kp.G,B=tp.B||kp.B,Lf=tp.L||kp.L,Rt=tp.R||kp.R;
 if(G)v=Math.min(120,v+30*dt);else v=Math.max(0,v-8*dt);
 if(B)v=Math.max(0,v-80*dt);
 steer+=((Rt-Lf)-steer)*Math.min(1,6*dt);
 px+=steer*1.5*Math.min(1,v/30)*dt;
 px-=curve(z+80)*(v/100)*(v/100)*.7*dt;
 if(Math.abs(px)>1.1){if(v>35)v=Math.max(35,v-60*dt);shake=Math.max(shake,.1)}
 px=Math.max(-1.6,Math.min(1.6,px));
 z+=v/3.6*dt;tm-=dt;inv-=dt;shake-=dt;msgT-=dt;
 for(const k of cars){k.z+=k.s*dt;let d=k.z-z,dx=Math.abs(k.x-px);
  if(inv<=0&&Math.abs(d-DP)<3.5&&dx<.42){hp-=12+v/8;v*=.35;inv=1.2;shake=.5;k.z+=10;snd(80,.3,'sawtooth',.15);note('Crash!')}
  if(!k.pass&&d<DP-3.5){k.pass=1;if(dx>=.42&&dx<.8){coins++;note('Near miss! +1')}}}
 cars=cars.filter(k=>k.z-z>-30&&k.z-z<900);
 while(cars.length<Math.floor(5+lvl*1.5))spawn(500+R(250));
 if(z>=goal){rew=50+Math.floor(Math.max(0,tm))*2+Math.round(hp/2);coins+=rew;lvl++;save();snd(700,.4,'sine');end('win')}
 else if(hp<=0){why='Car wrecked';end('lose')}
 else if(tm<=0){why='Out of time';end('lose')}}
// drawing
function tree(px_,y,s){x.fillStyle='#5a3a1a';x.fillRect(px_-s*.1,y-s*.6,s*.2,s*.6);
 x.fillStyle='#1d5a2a';x.beginPath();x.moveTo(px_-s*.5,y-s*.5);x.lineTo(px_,y-s*1.8);x.lineTo(px_+s*.5,y-s*.5);x.fill()}
function car(cx,by,w,col){let h=w*.62;
 x.fillStyle='#111';x.fillRect(cx-w*.5,by-h*.22,w*.18,h*.22);x.fillRect(cx+w*.32,by-h*.22,w*.18,h*.22);
 x.fillStyle=col;x.fillRect(cx-w*.5,by-h*.7,w,h*.5);x.fillRect(cx-w*.38,by-h,w*.76,h*.36);
 x.fillStyle='#9cd';x.fillRect(cx-w*.3,by-h*.95,w*.6,h*.24);
 x.fillStyle='#f22';x.fillRect(cx-w*.46,by-h*.6,w*.16,h*.1);x.fillRect(cx+w*.3,by-h*.6,w*.16,h*.1)}
function bt(){const s=Math.min(100,H*.26),y=H-s-16;
 return{L:{x:16,y,w:s,h:s,t:'◀'},R:{x:28+s,y,w:s,h:s,t:'▶'},B:{x:W-2*s-28,y,w:s,h:s,t:'BRAKE'},G:{x:W-s-16,y,w:s,h:s,t:'GAS'}}}
function draw(){
 const hz=H*.4,cur=curve(z+80),xc=sc=>W/2+cur*(1-sc)*(1-sc)*W*.55;
 x.save();x.translate(shake>0?R(8)-4:0,0);
 let g=x.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#4a90d9');g.addColorStop(1,'#bde');x.fillStyle=g;x.fillRect(-10,0,W+20,hz);
 x.fillStyle='#4a7';x.beginPath();x.moveTo(-10,hz);for(let i=0;i<=W+20;i+=20)x.lineTo(i-10,hz-18-14*Math.sin(i/70+cur*3+z/400));x.lineTo(W+10,hz);x.fill();
 for(let y=Math.ceil(hz);y<H;y+=2){let sc=(y-hz)/(H-hz);if(sc<.012)continue;
  let d=D0/sc-D0,s=Math.floor((z+d)/12)%2,rw=W*.46*sc,cx=xc(sc)-px*rw;
  x.fillStyle=s?'#3a6b2e':'#417a33';x.fillRect(-10,y,W+20,2);
  x.fillStyle=s?'#555':'#5c5c5c';x.fillRect(cx-rw,y,rw*2,2);
  x.fillStyle=s?'#d33':'#eee';x.fillRect(cx-rw,y,rw*.05,2);x.fillRect(cx+rw*.95,y,rw*.05,2);
  if(s){x.fillStyle='#fff';for(const l of[-.333,.333])x.fillRect(cx+l*rw-rw*.01,y,rw*.02,2)}}
 const o=[{d:DP,t:'p'}];
 for(let i=0;i<22;i++){let zz=Math.ceil(z/28)*28+i*28,d=zz-z;if(d<1)continue;let sd=Math.floor(zz/28);o.push({d,t:'t',side:sd%2?1:-1,e:1.5+(sd*7%5)/10})}
 for(const k of cars){let d=k.z-z;if(d>-5&&d<900)o.push({d,t:'c',k})}
 o.sort((a,b)=>b.d-a.d);
 for(const e of o){let sc=D0/(e.d+D0),y=hz+(H-hz)*sc,rw=W*.46*sc,cx=xc(sc)-px*rw;
  if(e.t=='t')tree(cx+e.side*e.e*rw,y,rw*.22);
  else if(e.t=='c')car(cx+e.k.x*rw,y,rw*.4,e.k.col);
  else if(inv<=0||Math.floor(inv*10)%2)car(xc(sc),y,rw*.4,'#27c')}
 x.restore();
 // HUD
 x.fillStyle='#000a';x.fillRect(8,8,170,70);x.fillStyle='#fff';x.font='bold 16px sans-serif';x.textAlign='left';
 x.fillText(Math.round(v)+' km/h',16,28);x.fillText('Time: '+Math.max(0,Math.ceil(tm))+' s',16,48);x.fillText(Math.max(0,Math.round(goal-z))+' m to go',16,68);
 x.fillStyle='#000a';x.fillRect(W-168,8,160,44);x.fillStyle='#fff';x.fillText('Coins: '+coins,W-160,26);
 x.fillStyle='#333';x.fillRect(W-160,34,144,10);x.fillStyle=hp>40?'#3d3':'#e33';x.fillRect(W-160,34,144*Math.max(0,hp)/100,10);
 if(msgT>0){x.textAlign='center';x.font='bold 26px sans-serif';x.fillStyle='#ff0';x.fillText(msg,W/2,H*.2);x.textAlign='left'}
 if(st=='play'){const b=bt();x.textAlign='center';x.font='bold 18px sans-serif';
  for(const n in b){const r=b[n],on=tp[n]||kp[n];x.fillStyle=on?'#fff8':'#fff3';x.fillRect(r.x,r.y,r.w,r.h);x.fillStyle='#fff';x.fillText(r.t,r.x+r.w/2,r.y+r.h/2+6)}x.textAlign='left'}
 else{x.fillStyle='#000c';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.textAlign='center';
  x.font='bold 38px sans-serif';x.fillText(st=='menu'?'CITY DRIVER':st=='win'?'MISSION COMPLETE!':'MISSION FAILED',W/2,H*.28);
  x.font='20px sans-serif';
  if(st=='win'){x.fillText('Reward: +'+rew+' coins',W/2,H*.43);x.fillText('Next: Mission '+lvl,W/2,H*.53)}
  else if(st=='lose'){x.fillText(why,W/2,H*.43);x.fillText('Mission '+lvl+' again',W/2,H*.53)}
  else{x.fillText('Mission '+lvl+': reach '+(1000+lvl*500)+' m in '+Math.round((1000+lvl*500)/20)+' s',W/2,H*.43);
   x.fillText('Dodge traffic and stay on the road',W/2,H*.53);x.fillText('Coins: '+coins,W/2,H*.63)}
  x.font='bold 22px sans-serif';x.fillStyle='#4f4';x.fillText('Tap to '+(st=='menu'?'start':st=='win'?'continue':'retry'),W/2,H*.8);x.textAlign='left'}}
let last=0;function loop(t){let dt=Math.min(.05,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
// input
function tch(e){e.preventDefault();tp.L=tp.R=tp.G=tp.B=0;const b=bt();
 for(const t of e.touches)for(const n in b){const r=b[n];if(t.clientX>r.x&&t.clientX<r.x+r.w&&t.clientY>r.y&&t.clientY<r.y+r.h)tp[n]=1}}
c.addEventListener('touchstart',e=>{try{ac().resume()}catch(_){}
 if(st!='play'){e.preventDefault();if(performance.now()-stAt>800)start();return}tch(e)},{passive:false});
for(const n of['touchmove','touchend','touchcancel'])c.addEventListener(n,tch,{passive:false});
const KM={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'G',ArrowDown:'B'};
addEventListener('keydown',e=>{if(KM[e.key])kp[KM[e.key]]=1;if(st!='play'&&(e.key==' '||e.key=='Enter'))start()});
addEventListener('keyup',e=>{if(KM[e.key])kp[KM[e.key]]=0});
c.addEventListener('mousedown',()=>{if(st!='play'&&performance.now()-stAt>800)start()});
</script></body></html>
